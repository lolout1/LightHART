# Fall Detection Optimized Configuration
model: Models.transformer.OptimizedFallDetector
model_args:
  mocap_frames: 128
  acc_frames: 128
  num_classes: 1
  num_heads: 2
  acc_coords: 4
  num_layer: 2
  embed_dim: 64
  dropout: 0.3
  activation: 'gelu'

dataset_args:
  age_group: ['young']
  modalities: ['accelerometer']
  sensors: ['watch']
  mode: 'sliding_window'
  max_length: 128
  task: 'fd'

base_lr: 0.0005
weight_decay: 0.0001
batch_size: 32
num_epoch: 100

subjects: [29,30, 31,33,45, 46, 34,37, 39, 38, 43, 35, 36, 44, 34, 32]
feeder: Feeder.Make_Dataset.UTD_mm
train_feeder_args:
  batch_size: 32

val_feeder_args:
  batch_size: 32

test_feeder_args:
  batch_size: 32
